name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Cancel outdated runs of pull requests, but never a run on master, which may be deploying.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      # --all-features also checks that schemas/ is up to date (tests/schema.rs)
      - run: cargo test --all-features

  web:
    name: Wasm bindings and web page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      # Node.js from mise.toml
      - uses: jdx/mise-action@v5
      - run: wasm-pack test --node crates/auto-composer-wasm
      # `npm ci` links crates/auto-composer-wasm/pkg, so build it first
      - run: npm run wasm
        working-directory: web
      - run: npm ci
        working-directory: web
      # --ignore-scripts skips `prebuild`, which would build the wasm package again
      - run: npm run build --ignore-scripts
        working-directory: web
      - if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  # Publish the page built above to GitHub Pages, only from master and only when every check passed.
  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [rust, web]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
