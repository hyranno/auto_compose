[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
license-file = "LICENSE.txt"
repository = "https://github.com/hyranno/auto_compose"

[workspace.dependencies]
# Without the default features, which need an OS source of randomness (getrandom).
rand = { version = "0.10.4", default-features = false, features = ["alloc"] }
rand_pcg = "0.10.3"
schemars = "1.2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6.5"
tsify = { version = "0.5.8", default-features = false, features = ["js"] }
wasm-bindgen = "0.2"
